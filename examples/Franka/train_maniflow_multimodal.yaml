# Multi-camera RGB + dense XYZ pointmap + robot state

# Camera keys and visual token counts are auto-derived from shape_meta.
# To use different cameras, change shape_meta.obs and provide a matching
# collate function (RGB keys must end with "_rgb", pointmap with "_ptmap").

run_id: maniflow_multimodal
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl]
wandb_entity: ""
wandb_project:
is_debug: false

framework:
  name: ManiFlowMultiModal
  model_name: DiTX
  # Placeholder for train_hvla.py build_model log (no VLM for ManiFlow)
  qwenvl:
    base_vlm: ManiFlowMultiModal

  # --- DiTX architecture ---
  n_layer: 12 # 12 for full model, 8 for accelerated training
  n_head: 8
  n_emb: 768
  qkv_bias: true
  qk_norm: true
  block_type: DiTX
  obs_as_global_cond: true

  # --- action / observation horizon ---
  horizon: 16
  n_obs_steps: 1
  n_action_steps: 16
  num_inference_steps: 12

  # --- encoder ---
  encoder_output_dim: 768
  rgb_backbone: vit_base_patch16_clip_224.openai
  # Freeze the pretrained RGB backbone (feature extractor only) instead of fine-tuning it.
  freeze_rgb_backbone: false
  ptmap_backbone: convnextv2_tiny.fcmae_ft_in22k_in1k
  propr_mask_prob: 0.0
  # "spatial": full spatial tokens per camera (e.g. 196 for ViT, 49 for ConvNeXt)
  # "pooled":  1 global token per camera (fast training)
  encoder_type: spatial

  # --- pointmap encoder type ---
  # "dense":  ConvNeXtV2 on full 224x224 XYZ pointmap (slow, high capacity)
  # "sparse": Lightweight PointNet on random-sampled 3D points (fast, like maniflow PCD)
  ptmap_encoder_type: sparse
  sparse_num_points: 64
  sparse_out_channels: 256
  sparse_hidden_dim: 128

  # --- state injection: "token" or "timestep_concat" ---
  state_injection_mode: timestep_concat
  # --- language injection: "token" or "timestep_concat" ---
  lang_injection_mode: timestep_concat

  # visual_cond_len is auto-computed from encoder probe passes.
  # Uncomment to override:
  # visual_cond_len: 6

  # --- timestep embedding ---
  diffusion_timestep_embed_dim: 128
  diffusion_target_t_embed_dim: 128

  # --- consistency flow training ---
  flow_batch_ratio: 0.75
  consistency_batch_ratio: 0.25
  sample_t_mode_flow: beta
  sample_t_mode_consistency: discrete
  sample_dt_mode_consistency: uniform
  sample_target_t_mode: relative
  denoise_timesteps: 10

  language_conditioned: false
  language_model: t5-small

  # language_mode: "action_goal" keeps full action_goal_str (e.g. "pick <409,210>")
  #                "action_only" drops coordinates (e.g. "pick")
  language_mode: action_goal

  # --- spatial target conditioning ---
  # target_injection_mode: null (disabled), "token" (heatmap as context tokens),
  #   "timestep_concat" (heatmap fused into AdaLN), "target_embedding" (Gaussian bias on RGB),
  #   or "target_pe" (learned per-patch encoding on RGB)
  target_injection_mode: null
  target_sigma: 1.5
  target_mask_prob: 0.0
  # heatmap_encoder_type: "shared_rgb" (reuse ViT) or "convnextv2" (separate backbone)
  # Only used when target_injection_mode is "token" or "timestep_concat"
  heatmap_encoder_type: shared_rgb
  heatmap_backbone: convnextv2_tiny.fcmae_ft_in22k_in1k


  # --- EMA ---
  ema:
    power: 0.75
    max_value: 0.9999
    min_value: 0.0
    inv_gamma: 1.0
    update_after_step: 0

  # --- image augmentation (applied per sample in the dataloader during training) ---
  # Crop/resize/rotation are shared by RGB, heatmap and depth so they stay aligned;
  # color_jitter is RGB only.
  random_crop_ratio: 0.95
  random_rotation_degrees: 5.0
  color_jitter:
    brightness: 0.3
    contrast: 0.4
    saturation: 0.5
    hue: 0.08

  # --- RGB normalization (CLIP defaults; change if using a different backbone) ---
  # rgb_mean: [0.48145466, 0.4578275, 0.40821073]
  # rgb_std: [0.26862954, 0.26130258, 0.27577711]

  # --- pointmap normalization (camera-space XYZ bounds, always applied) ---
  # ptmap_min: [-1.0, -1.0, 0.0]
  # ptmap_max: [1.0, 1.0, 2.0]

  # --- state MLP hidden dimension ---
  # state_mlp_hidden_dim: 256

  # --- shape_meta: defines cameras, resolution, state/action dims ---
  # Camera keys ending with "_rgb" → RGB encoder
  # Camera keys ending with "_ptmap" → pointmap encoder
  # Image resolution is read from the shape [3, H, W]
  shape_meta:
    obs:
      front_rgb:      {shape: [3, 224, 224]}
      gripper_rgb:   {shape: [3, 224, 224]}
      front_depth:   {shape: [1, 224, 224]}
      gripper_depth:   {shape: [1, 224, 224]}
      front_ptmap:    {shape: [3, 224, 224]}
      camera_intrinsics: {shape: [2, 4]}
      gripper_ptmap: {shape: [3, 224, 224]}
      agent_pos:     {shape: [8]}
    action: {shape: [9]}

datasets:
  vla_data:
    dataset_py: franka_multimodal
    data_root_dir: /path/to/franka_data
    num_workers: 4
    prefetch_factor: 2
    ptmap_size: 224
    include_ptmap: true
    include_state: true
    # Depth video decoder: null -> PyAV gray12le on the base depth videos (full
    # 12-bit precision, default). Set to an RG8-split variant
    # (faster torchcodec random access) to read <camera>_<variant> instead:
    # rg8 / rg8_224 (Depth = R + G*256) or rg8_55 / rg8_55_224 (Depth = (R<<5)|G).
    depth_rg8: null
    # g12 depth videos: lossless HEVC gray12le (GOP 8, no B-frames) in <depth_key>_<variant>,
    # decoded exactly with PyAV; ~1/5 of the RG8 bytes and ~2x faster per frame. Set to
    # g12_224 / g10_224 / g10_224_crf035 to read <camera>_<variant>. Mutually exclusive with depth_rg8.
    depth_g12: null
    # RGB-guided joint bilateral depth noise (train-time; requires use_depth: true).
    # add_depth_noise: false
    # depth_noise_sigma_color_rgb: 10.0
    # depth_noise_sigma_space: 3.5
    # depth_noise_guide_bits: 2
    # depth_noise_diameter: 21
    # depth_noise_ideal_mix: 0.6
    per_device_batch_size: 32
    val_ratio: 0.05
    action_mode: abs
    pause_on_attempt: false
    # RGB camera feature keys in the LeRobot parquet dataset.
    front_cam_key: observation.images.camera:front_camera
    gripper_cam_key: observation.images.camera:gripper_camera

trainer:
  max_train_steps: 5000
  num_warmup_steps: 500
  save_interval: 100
  eval_interval: 100
  logging_frequency: 100
  learning_rate:
    base: 1.0e-4
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    weight_decay: 1.0e-3
    eps: 1.0e-8
  lr_scheduler_type: cosine
  scheduler_specific_kwargs: {}
    # min_lr: 1.0e-6
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  freeze_modules: ""
  save_format: safetensors
  # auto: resume from the newest finished checkpoint in the run dir if one exists, so
  # preempted/requeued jobs pick up where they left off. force: require one. never: always fresh.
  resume_mode: auto
  resume_epoch: null
  resume_step: null
  pretrained_checkpoint: null
  enable_gradient_checkpointing: false
  enable_mixed_precision_training: true
